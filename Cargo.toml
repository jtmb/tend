[package]
name = "tend"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "A quiet, native control panel for Ubuntu workstation maintenance"
default-run = "tend"

[dependencies]
gtk = { package = "gtk4", version = "0.10", features = ["v4_12"] }
adw = { package = "libadwaita", version = "0.8", features = ["v1_5"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fs2 = "0.4"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
debug = 0
